# What every change must pass, used by ci.yml (pull requests into develop)
# and release.yml (pull requests into master).
name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check.
        type: string
        required: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      - run: pnpm exec prettier --check "**/*.{ts,tsx,md}"

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm check-types

  test:
    # The framework runs on Node 24 and later, on Linux and on macOS (what
    # differs there: watching files).
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test

  package:
    # What would be published: every package packs.
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: |
          for name in chapterjs create-chapter create-chapterjs; do
            (cd "packages/$name" && pnpm pack --pack-destination "$RUNNER_TEMP")
          done
